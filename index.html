
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free VPN leak test tool. Check if your VPN leaks your real IP, WebRTC, or DNS. Instant results, no signup.">
    <meta name="keywords" content="VPN leak test, IP leak, WebRTC leak, DNS leak, VPN check, privacy">
    <title>CHECKMA - VPN Leak Test</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            color: #00D9FF;
            font-size: 26px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .box {
            background: #111;
            border-radius: 12px;
            padding: 25px 20px;
            margin: 20px auto;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0, 217, 255, 0.1);
        }
        .status {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            background: #333;
            transition: all 0.3s ease;
        }
        .status.safe { background: #00C853; }
        .status.warning { background: #FFC107; color: #000; }
        .status.danger { background: #FF1744; }
        .ip {
            font-size: 24px;
            font-weight: bold;
            color: #00D9FF;
            margin: 15px 0;
            word-break: break-all;
        }
        .info {
            color: #888;
            font-size: 14px;
        }
        .explanation {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-size: 14px;
            color: #ccc;
            text-align: right;
            line-height: 1.7;
            border-right: 3px solid #00D9FF;
        }
        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:active { 
            background: #00D9FF;
            transform: scale(0.98);
        }
        .next-steps {
            background: #111;
            border-radius: 12px;
            padding: 20px;
            margin: 20px auto;
            max-width: 420px;
            text-align: right;
            border-top: 3px solid #00D9FF;
        }
        .next-steps h2 {
            color: #00D9FF;
            font-size: 18px;
            margin-top: 0;
        }
        .next-steps p {
            color: #ccc;
            font-size: 14px;
            line-height: 1.7;
        }
        .next-steps ul {
            padding-right: 20px;
            color: #ccc;
            font-size: 14px;
            line-height: 1.9;
        }
        .next-steps a {
            color: #00D9FF;
            text-decoration: none;
            font-weight: bold;
        }
        .next-steps a:hover {
            text-decoration: underline;
        }
        .footer {
            color: #555;
            font-size: 12px;
            margin-top: 30px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>CHECKMA</h1>
        <p class="subtitle">VPN Leak Test</p>
        
        <div class="status" id="status">⏳</div>
        
        <div class="ip" id="ip">جاري الفحص...</div>
        <div class="info" id="location">...</div>
        
        <div class="explanation" id="explanation">
            جاري تحليل الاتصال ديالك...
        </div>
        
        <button onclick="checkIP()">🔄 إعادة الفحص</button>
    </div>

    <div class="next-steps">
        <h2>🛡️ كيفاش تحمي راسك؟</h2>
        <p>إلا كانت النتيجة ديالك ماشي آمنة، ها 3 خطوات:</p>
        <ul>
            <li>✅ استعمل VPN موثوق</li>
            <li>✅ عطّل WebRTC ف المتصفح</li>
            <li>✅ استعمل DNS آمن (Cloudflare / NextDNS)</li>
        </ul>
        <p style="margin-top: 15px;">
            🔗 <a href="#" target="_blank">توصياتنا للـ VPN</a>
        </p>
    </div>

    <p class="footer">CHECKMA © 2026 — Free Privacy Tools</p>

    <script>
        async function checkIP() {
            const status = document.getElementById('status');
            const ipEl = document.getElementById('ip');
            const locEl = document.getElementById('location');
            const expEl = document.getElementById('explanation');

            status.className = 'status';
            status.innerText = '⏳';
            ipEl.innerText = 'جاري الفحص...';
            locEl.innerText = '...';
            expEl.innerText = 'جاري تحليل الاتصال ديالك...';

            try {
                const response = await fetch('https://ipwho.is/');
                const data = await response.json();

                if (data.success) {
                    ipEl.innerText = data.ip;
                    locEl.innerText = data.city + ' - ' + data.country + ' | ' + 
                        (data.connection ? data.connection.isp : '');

                    const vpnKeywords = ['vpn', 'hosting', 'datacenter', 'cloud', 'server', 'proxy'];
                    const isp = (data.connection && data.connection.isp ? data.connection.isp : '').toLowerCase();
                    const isVPN = vpnKeywords.some(k => isp.includes(k));

                    if (isVPN) {
                        status.className = 'status safe';
                        status.innerText = '✓';
                        expEl.innerHTML = '✅ <b>الاتصال ديالك آمن!</b><br>الـ IP اللي كيبان هو ديال سيرفر VPN، ماشي IP الحقيقي ديالك. بياناتك محمية.';
                    } else {
                        status.className = 'status warning';
                        status.innerText = '!';
                        expEl.innerHTML = '⚠️ <b>الـ IP الحقيقي ديالك مكشوف!</b><br>الـ IP اللي كيبان هو ديال مزود الخدمة ديالك (<b>' + (data.connection ? data.connection.isp : '') + '</b>).<br><br>إلا كنت كتستعمل VPN، هادا يعني أنه <b>كيسرّب</b> بياناتك.';
                    }
                } else {
                    status.className = 'status danger';
                    status.innerText = '✕';
                    ipEl.innerText = 'خطأ';
                    locEl.innerText = 'ما قدرناش نجيبو المعلومات';
                    expEl.innerText = '❌ وقع مشكل. حاول مرة أخرى.';
                }
            } catch (error) {
                status.className = 'status danger';
                status.innerText = '✕';
                ipEl.innerText = 'خطأ ف الاتصال';
                locEl.innerText = 'تحقق من الإنترنت';
                expEl.innerText = '❌ ما قدرناش نوصلو للسيرفر. تحقق من اتصالك بالإنترنت.';
            }
        }

        checkIP();
    </script>
</body>
</html>
