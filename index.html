<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECKMA - VPN Leak Test</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #00D9FF;
            font-size: 24px;
        }
        .box {
            background: #111;
            border-radius: 12px;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
        }
        .ip {
            font-size: 22px;
            font-weight: bold;
            color: #00D9FF;
            margin: 15px 0;
        }
        .info {
            color: #888;
            font-size: 14px;
        }
        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
        }
        button:active {
            background: #00D9FF;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>CHECKMA - VPN Leak Test</h1>
        <p class="info">Check if your VPN leaks your real IP</p>
        
        <div class="ip" id="ip">جاري التحميل...</div>
        <div class="info" id="location">...</div>
        
        <button onclick="checkIP()">🔄 إعادة الفحص</button>
    </div>

    <script>
        async function checkIP() {
            document.getElementById('ip').innerText = 'جاري التحميل...';
            document.getElementById('location').innerText = '...';
            
            try {
                const response = await fetch('https://ipwho.is/');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('ip').innerText = data.ip;
                    document.getElementById('location').innerText = 
                        data.city + ' - ' + data.country + ' | ' + 
                        (data.connection ? data.connection.isp : '');
                } else {
                    document.getElementById('ip').innerText = 'خطأ';
                    document.getElementById('location').innerText = 'حاول مرة أخرى';
                }
            } catch (error) {
                document.getElementById('ip').innerText = 'خطأ ف الاتصال';
                document.getElementById('location').innerText = 'حاول مرة أخرى';
            }
        }
        
        checkIP();
    </script>
</body>
</html>
